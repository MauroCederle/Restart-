<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#063d32" />
  <meta name="description" content="RESET Winter Retreat — 6, 7 e 8 dicembre 2026. Natura, persone, esperienze, consapevolezza e libertà." />
  <title>RESET Winter Retreat | 6–8 Dicembre 2026</title>
  <style>
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:#f7f3eb;font-family:Arial,Helvetica,sans-serif;color:#063d32}
    .page{position:relative;width:100%;max-width:1600px;margin:0 auto;line-height:0;overflow:hidden;background:#f7f3eb}
    .landing-image{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
    .hotspot{position:absolute;display:block;z-index:5;border-radius:999px;cursor:pointer}
    .hotspot:focus-visible{outline:4px solid #fff;outline-offset:3px;box-shadow:0 0 0 7px #063d32}
    /* Posizioni calcolate sull'immagine 1024 × 1536 */
    .top-whatsapp{top:1.0%;left:77.1%;width:17.2%;height:3.0%}
    .main-whatsapp{top:80.1%;left:29.5%;width:40.7%;height:4.6%}
    .nav-esperienza{top:1.3%;left:28.9%;width:10.5%;height:2.2%;border-radius:0}
    .nav-evento{top:1.3%;left:40.5%;width:8%;height:2.2%;border-radius:0}
    .nav-contatti{top:1.3%;left:61.8%;width:8%;height:2.2%;border-radius:0}
    .floating-wa{position:fixed;right:20px;bottom:20px;z-index:20;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#18c766;color:#fff;text-decoration:none;font-weight:800;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.9)}
    .floating-wa:hover{transform:translateY(-2px)}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    #esperienza,#evento,#contatti{position:absolute;pointer-events:none}
    #esperienza{top:52%} #evento{top:24%} #contatti{top:94%}
    @media(max-width:700px){.floating-wa{width:54px;height:54px;right:14px;bottom:14px}.top-whatsapp{left:75%;width:21%}.main-whatsapp{left:27%;width:46%}}
  </style>
</head>
<body>
  <main class="page" id="top">
    <img class="landing-image" src="assets/reset-landing.png" alt="RESET Winter Retreat, 6-7-8 dicembre 2026: natura, mindfulness, meditazione, camminate e ice experience." />

    <span id="esperienza" aria-hidden="true"></span>
    <span id="evento" aria-hidden="true"></span>
    <span id="contatti" aria-hidden="true"></span>

    <a class="hotspot nav-esperienza" href="#esperienza" aria-label="Vai alla sezione Esperienza"><span class="sr-only">Esperienza</span></a>
    <a class="hotspot nav-evento" href="#evento" aria-label="Vai alla sezione Evento"><span class="sr-only">Evento</span></a>
    <a class="hotspot nav-contatti" href="#contatti" aria-label="Vai ai contatti"><span class="sr-only">Contatti</span></a>

    <a class="hotspot top-whatsapp wa-link" href="#" aria-label="Richiedi informazioni su WhatsApp"><span class="sr-only">WhatsApp</span></a>
    <a class="hotspot main-whatsapp wa-link" href="#" aria-label="Scopri di più su WhatsApp"><span class="sr-only">Scopri di più su WhatsApp</span></a>
  </main>

  <a class="floating-wa wa-link" href="#" aria-label="Apri WhatsApp">WA</a>

  <script>
    // Numero WhatsApp in formato internazionale, senza +, spazi o trattini.
    const WHATSAPP_NUMBER = '393464000303';
    const MESSAGE = 'Ciao, vorrei ricevere maggiori informazioni sul RESET Winter Retreat del 6-8 dicembre 2026.';
    const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(MESSAGE)}`;
    document.querySelectorAll('.wa-link').forEach(link => {
      link.href = waUrl;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
    });
  </script>
</body>
</html>
